<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SG Fresh Grocer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <h1>SG Fresh Grocer</h1>
        <div class="cart-icon" onclick="toggleCart()">
            <i class="fas fa-shopping-cart"></i>
            <span id="cart-count">0</span>
        </div>
    </header>

    <main>
        <section id="solo-products">
            <h2>Fresh Groceries</h2>
            <div class="grid" id="product-grid">
                </div>
        </section>

        <hr>

        <section id="bundles">
            <h2>Value Bundles (20% OFF)</h2>
            <div class="grid" id="bundle-grid">
                </div>
        </section>

        <hr>

        <section id="recipes">
            <h2>Bundle Recipes</h2>
            <div class="recipe-container" id="recipe-grid">
                </div>
        </section>
    </main>

    <div id="cart-sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3>Your Cart</h3>
            <button onclick="toggleCart()">&times;</button>
        </div>
        <div id="cart-items"></div>
        <div class="sidebar-footer">
            <h4>Total: S$<span id="cart-total">0.00</span></h4>
            <button class="checkout-btn">Checkout</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
